version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: hyperqueue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: hyperqueue-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hyperqueue
      POSTGRES_PASSWORD: hyperqueue_secret
      POSTGRES_DB: hyperqueue_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperqueue -d hyperqueue_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  pg_data:
